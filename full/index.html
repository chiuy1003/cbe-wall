<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CBE Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Layout: wall viewer (zoomable panorama + mini-map strip) under a slim header; gallery tab swaps in a grid of every close-up. */
:root{
  --bg:#f3f2ee; --surface:#fbfaf7; --ink:#20242a; --muted:#5d646d; --line:#d9d6ce;
  --accent:#2c6c8c; --accent-soft:rgba(44,108,140,.14);
  --accent-ink:#ffffff; --pin-fill:#2c6c8c; --pin-plus:#ffffff;
  --wall:#e7e4dc; --dim:rgba(20,24,28,.38);
  --modal-bg:#0d0f11; --modal-ink:#e9eaec; --modal-btn:#1c2024; --modal-line:#353a40;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1c1f23; --ink:#ebeae6; --muted:#a2a8af; --line:#31353b;
  --accent:#86bcd6; --accent-soft:rgba(134,188,214,.18);
  --accent-ink:#0f1214; --pin-fill:#86bcd6; --pin-plus:#0f1214;
  --wall:#0f1113; --dim:rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1c1f23; --ink:#ebeae6; --muted:#a2a8af; --line:#31353b;
  --accent:#86bcd6; --accent-soft:rgba(134,188,214,.18);
  --accent-ink:#0f1214; --pin-fill:#86bcd6; --pin-plus:#0f1214;
  --wall:#0f1113; --dim:rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,#minimap:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;
  padding:12px 16px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{min-width:0}
.brand h1{margin:0;font:600 24px/1.1 var(--font-display);letter-spacing:.1px;text-wrap:balance}
.brand p{margin:3px 0 10px;color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}

main{flex:1;display:flex;min-height:0}
.wall-view{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.osd{flex:1;min-height:260px;background:var(--wall)}
.tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;align-items:center;z-index:5}
.tools button{height:38px;min-width:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:13.5px}
/* Close-Ups on/off switch: always opaque so it reads over any part of the wall */
#pinsToggle{gap:8px;padding:0 10px 0 11px;font-weight:600}
#pinsToggle .mini{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pin-fill);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
#pinsToggle .sw{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line);transition:background .15s;flex:none}
#pinsToggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
#pinsToggle[aria-checked="true"] .sw{background:var(--accent)}
#pinsToggle[aria-checked="true"] .sw::after{transform:translateX(14px)}
#pinsToggle .state{min-width:22px;text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.3px}
#pinsToggle:hover{border-color:var(--accent)}
.farnote{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;font-size:13px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;pointer-events:none;white-space:nowrap}

/* Close-up buttons on the wall: small fixed-size circles at each message's top-right corner. */
.pin{position:relative;width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--pin-fill);color:var(--pin-plus);
  box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;transition:transform .12s;display:block}
.pin svg{margin:auto}
.pin::after{content:"";position:absolute;inset:-7px;border-radius:50%} /* bigger tap target than it looks */
.pin:hover,.pin:focus-visible{transform:scale(1.2)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pin-fill);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line);vertical-align:-1px}
.hide-pins .pin,.far .pin{display:none!important}
.boxhint{border:2px solid var(--accent);border-radius:4px;background:var(--accent-soft);pointer-events:none;opacity:0;transition:opacity .12s}
.boxhint.on{opacity:1}

/* Mini-map: the whole wall in one strip; the bright window is what you are looking at. */
.mapbar{padding:8px 12px 6px;background:var(--surface);border-top:1px solid var(--line)}
#minimap{position:relative;height:56px;border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none;
  background-color:var(--wall);background-size:100% 100%;background-repeat:no-repeat;user-select:none}
#mmWin{position:absolute;min-width:8px;min-height:6px;cursor:grab;border:2px solid var(--accent);border-radius:3px;box-shadow:0 0 0 9999px var(--dim);pointer-events:none}
.hint{margin:0;padding:2px 14px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:13px;background:var(--surface)}

.gallery{flex:1;overflow:auto;padding:16px 16px 40px}
.gallery h2{margin:24px 0 10px;font:600 15px/1.2 var(--font-body);color:var(--muted)}
.gallery h2:first-child{margin-top:4px}
.gallery h2 small{font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{display:block;width:100%;max-width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:8px;padding:0;
  background-color:var(--wall);background-image:url(thumbs.jpg);background-repeat:no-repeat}

.modal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--modal-bg);color:var(--modal-ink);overflow:hidden}
.mbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));position:relative;z-index:2;background:var(--modal-bg)}
.mbar button{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--modal-line);background:var(--modal-btn);color:var(--modal-ink);
  padding:0 12px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none}
#mTitle{font-size:14px;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
#photo{flex:1;background:var(--modal-bg)}

@media (max-width:600px){
  .brand h1{font-size:20px}
  .tabs button{padding:10px 7px;font-size:14px}
  .mWall{display:none}
  #pinsToggle .state{display:none}
  .mbar{gap:6px;padding-left:10px;padding-right:10px}
  .mbar button{min-width:38px;padding:0 10px}
  #minimap{height:40px}
}
@media (prefers-reduced-motion: reduce){ .pin,.boxhint,#pinsToggle .sw,#pinsToggle .sw::after{transition:none} }
</style>

<header class="top">
  <div class="brand">
    <h1>CBE Wall</h1>
    <p>Signed by CBCGB · September 5–6, 2026</p>
  </div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button id="tab-panel" role="tab" data-view="panel" aria-selected="true">Panel Wall</button>
    <button id="tab-concrete" role="tab" data-view="concrete" aria-selected="false">Concrete Wall</button>
    <button id="tab-gallery" role="tab" data-view="gallery" aria-selected="false">All Messages</button>
  </nav>
</header>

<main>
  <section id="wallView" class="wall-view">
    <div id="wall" class="osd" aria-label="Zoomable wall"></div>
    <div class="farnote" id="farNote" hidden>Zoom in to see the close-up buttons</div>
    <div class="tools">
      <button id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="whole" aria-label="Show the whole wall" title="Show the whole wall"></button>
      <button id="pinsToggle" role="switch" aria-checked="true" title="Click to hide the close-up dots"><span class="mini" aria-hidden="true"></span><span class="lbl">Close-Ups</span><span class="sw" aria-hidden="true"></span><span class="state" aria-hidden="true">ON</span></button>
    </div>
    <div class="mapbar">
      <div id="minimap" role="slider" tabindex="0" aria-label="Position along the wall" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="mmWin"></div></div>
    </div>
    <p class="hint">Drag the strip above or scroll sideways to move along the wall. Tap a <span class="dot" aria-hidden="true"></span> to open a message's close-up.</p>
  </section>
  <section id="galleryView" class="gallery" hidden></section>
</main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbar">
    <button id="mClose" aria-label="Close photo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span id="mTitle"><span class="mWall"></span><span class="mCount"></span></span>
    <span class="spacer"></span>
    <button id="mOnWall" title="Show this message on the wall"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Locate</button>
    <button id="mPrev" aria-label="Previous photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="mNext" aria-label="Next photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div id="photo"></div>
</div>

<script src="lib/openseadragon.min.js"></script>
<script src="data.js"></script>
<script>
(async function () {
  const data = window.WALL_DATA; // inlined from data.json so the page works opened straight from disk
  const photos = data.photos, S = data.sprite;
  const byId = Object.fromEntries(photos.map(p => [p.id, p]));
  const $ = id => document.getElementById(id);
  const P = OpenSeadragon.Point;
  const WALL_NAME = { panel: 'Panel Wall', concrete: 'Concrete Wall' };
  const ICON_PIN = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 1.5v7M1.5 5h7"/></svg>';
  const ICON_WHOLE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

  // Every list runs left to right along the wall: panel wall first, then concrete.
  const xOf = p => (p.box ? p.box[0] : 0);
  const ALL = photos.slice().sort((a, b) => (a.wall === b.wall ? xOf(a) - xOf(b) : a.wall === 'panel' ? -1 : 1));
  const ON = { panel: ALL.filter(p => p.wall === 'panel'), concrete: ALL.filter(p => p.wall === 'concrete') };

  // ---- wall ----
  const wallEl = $('wall');
  const viewer = OpenSeadragon({
    element: wallEl, prefixUrl: '', showNavigationControl: false, showNavigator: false,
    visibilityRatio: 1, constrainDuringPan: true, minZoomImageRatio: 1, maxZoomPixelRatio: 2.5,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
    gestureSettingsTouch: { pinchRotate: false }, animationTime: 0.6
  });
  const vp = () => viewer.viewport;
  let currentWall = null, hintEl = null, aspect = 1;

  function openWall(wall, then) {
    if (currentWall === wall) { then && then(); return; }
    currentWall = wall; returnTo = null;
    $('minimap').style.backgroundImage = 'url(walls/' + wall + '-map.jpg)';
    viewer.addOnceHandler('open', () => {
      const s = viewer.world.getItemAt(0).getContentSize(); aspect = s.y / s.x;
      sizeMap(); addPins(wall); fitHeight(); updWhole(); then && then();
    });
    viewer.open({ Image: { xmlns: 'http://schemas.microsoft.com/deepzoom/2008', Url: 'walls/' + wall + '_files/', Format: 'jpg',
      Overlap: '1', TileSize: '2046', Size: { Width: String(data.walls[wall].width), Height: String(data.walls[wall].height) } } });
  }
  // Start zoomed so the wall fills the height, at the left end.
  function fitHeight() {
    const c = vp().getContainerSize(), w = aspect * (c.x / c.y);
    vp().fitBounds(new OpenSeadragon.Rect(0, 0, Math.min(1, w), aspect), true);
  }
  function addPins(wall) {
    viewer.clearOverlays();
    hintEl = document.createElement('div'); hintEl.className = 'boxhint';
    viewer.addOverlay({ element: hintEl, location: new OpenSeadragon.Rect(0, 0, 0, 0) });
    const list = ON[wall].filter(p => p.box);
    const placed = [], GAP = 170; // image px; keeps neighbouring buttons from sitting on top of each other
    list.forEach((p, i) => {
      const [x, y, w, h] = p.box;
      let ax = x + w * 0.97, ay = y + h * 0.04;
      for (let k = 0; k < 6 && placed.some(q => Math.abs(q[0] - ax) < GAP && Math.abs(q[1] - ay) < GAP); k++) ax -= GAP;
      placed.push([ax, ay]);
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'pin'; el.innerHTML = ICON_PIN;
      el.setAttribute('aria-label', 'Open close-up ' + (i + 1) + ' of ' + list.length);
      viewer.addOverlay({ element: el, location: vp().imageToViewportCoordinates(ax, ay), placement: OpenSeadragon.Placement.TOP_RIGHT });
      new OpenSeadragon.MouseTracker({ element: el, clickHandler: e => { if (e.quick) openPhoto(p.id); } });
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPhoto(p.id); } });
      const on = () => { viewer.updateOverlay(hintEl, vp().imageToViewportRectangle(x, y, w, h)); hintEl.classList.add('on'); };
      const off = () => hintEl.classList.remove('on');
      el.addEventListener('mouseenter', on); el.addEventListener('focus', on);
      el.addEventListener('mouseleave', off); el.addEventListener('blur', off);
    });
  }

  $('zoomIn').onclick = () => { vp().zoomBy(1.6); vp().applyConstraints(); };
  $('zoomOut').onclick = () => { vp().zoomBy(1 / 1.6); vp().applyConstraints(); };
  $('pinsToggle').onclick = e => {
    const b = e.currentTarget, on = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(on)); wallEl.classList.toggle('hide-pins', !on);
    b.querySelector('.state').textContent = on ? 'ON' : 'OFF';
    b.title = on ? 'Click to hide the close-up dots' : 'Click to show the close-up dots';
  };

  // Whole-wall button: first press shows the whole wall, second press goes back to where you were.
  let returnTo = null;
  const atWhole = () => vp().getZoom() <= vp().getHomeZoom() * 1.03;
  function updWhole() {
    const back = !!returnTo && atWhole(), b = $('whole');
    b.innerHTML = back ? ICON_BACK : ICON_WHOLE;
    const t = back ? 'Zoom back to where you were' : 'Show the whole wall';
    b.setAttribute('aria-label', t); b.title = t;
  }
  $('whole').onclick = () => {
    if (returnTo && atWhole()) { vp().fitBounds(returnTo); returnTo = null; }
    else { returnTo = atWhole() ? null : vp().getBounds(); vp().goHome(); }
    updWhole();
  };
  viewer.addHandler('animation-finish', updWhole);

  // Hide the close-up buttons when zoomed so far out that they would pile on top of each other.
  viewer.addHandler('update-viewport', () => {
    const far = vp().viewportToImageZoom(vp().getZoom(true)) < 0.07;
    wallEl.classList.toggle('far', far);
    $('farNote').hidden = !far || wallEl.classList.contains('hide-pins');
    mmUpdate();
  });

  // Sideways scrolling: horizontal wheel, trackpad swipe, or Shift + wheel moves along the wall.
  function panPixels(dx) {
    vp().panBy(vp().deltaPointsFromPixels(new P(dx, 0), true), true);
    vp().applyConstraints(true);
  }
  function wheelUnit(e) { return e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? wallEl.clientWidth : 1; }
  // A Magic Mouse or trackpad swipe arrives as a stream of scroll events with some up/down wobble and a
  // momentum tail. Decide once per gesture, from its first few events, whether it is sideways or up/down,
  // and stick with that for the rest of the gesture. Up/down gestures and pinches go to the viewer (zoom).
  function sidewaysGestures(el, onSideways) {
    let g = null;
    el.addEventListener('wheel', e => {
      if (e.ctrlKey) return;
      const unit = wheelUnit(e);
      let dx = e.deltaX * unit, dy = e.deltaY * unit;
      if (e.shiftKey && !e.deltaX) { dx = dy; dy = 0; }
      const now = performance.now(), ax = Math.abs(dx);
      // New gesture after a pause, or a fresh push that starts while the last one is still coasting.
      // (A coasting tail only shrinks, so a delta well above the smallest one since the step means a new push.)
      if (!g || now - g.last > 200 || (g.done && ax > 10 && ax > 2.5 * g.minAx)) g = { dir: null, sx: 0, sy: 0, acc: 0, done: false, minAx: Infinity };
      g.last = now;
      if (g.done) g.minAx = Math.min(g.minAx, ax);
      if (!g.dir) { g.sx += ax; g.sy += Math.abs(dy); if (g.sx + g.sy >= 24) g.dir = g.sx >= g.sy * 0.6 ? 'x' : 'y'; }
      if (g.dir === 'y') return;
      e.preventDefault(); e.stopPropagation(); // undecided or sideways: keep the viewer from zooming
      if (g.dir === 'x') onSideways(dx, g);
    }, { capture: true, passive: false });
  }
  sidewaysGestures(wallEl, dx => panPixels(dx));

  // ---- mini-map slider ----
  const mm = $('minimap'), win = $('mmWin');
  function sizeMap() {
    const small = matchMedia('(max-width:600px)').matches;
    mm.style.height = Math.round(Math.max(small ? 34 : 40, Math.min(small ? 48 : 72, mm.clientWidth * aspect))) + 'px';
  }
  function mmUpdate() {
    if (!viewer.world.getItemAt(0)) return;
    const b = vp().getBounds(true);
    const l = Math.max(0, b.x), r = Math.min(1, b.x + b.width);
    const t = Math.max(0, b.y / aspect), bt = Math.min(1, (b.y + b.height) / aspect);
    win.style.left = l * 100 + '%'; win.style.width = Math.max(0, r - l) * 100 + '%';
    win.style.top = t * 100 + '%'; win.style.height = Math.max(0, bt - t) * 100 + '%';
    mm.setAttribute('aria-valuenow', String(Math.round((b.x + b.width / 2) * 100)));
  }
  function frac(e) { const r = mm.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
  // Strip behaviour: grabbing the bright window drags it freely (left/right, and up/down when zoomed in
  // far enough that the window is shorter than the strip). Clicking elsewhere on the strip jumps there
  // left/right only, keeping the current up/down position, and a drag that starts that way stays sideways.
  function centerAt(fx, now, fy) {
    const y = fy === undefined ? vp().getCenter(true).y : fy * aspect;
    vp().panTo(new P(fx, y), now); vp().applyConstraints(now);
  }
  let drag = null;
  mm.addEventListener('pointerdown', e => {
    if (!viewer.world.getItemAt(0)) return;
    mm.setPointerCapture(e.pointerId);
    const f = frac(e), b = vp().getBounds(true), c = vp().getCenter(true);
    const r = mm.getBoundingClientRect(), tx = 8 / r.width, ty = 8 / r.height; // 8 px grab margin
    const inX = f.x >= b.x - tx && f.x <= b.x + b.width + tx;
    const inY = f.y >= b.y / aspect - ty && f.y <= (b.y + b.height) / aspect + ty;
    if (inX && inY) drag = { free: true, ox: f.x - c.x, oy: f.y - c.y / aspect };
    else { drag = { free: false, ox: 0 }; centerAt(f.x, false); }
  });
  mm.addEventListener('pointermove', e => {
    if (!drag) return;
    const f = frac(e);
    if (drag.free) centerAt(f.x - drag.ox, true, f.y - drag.oy); else centerAt(f.x - drag.ox, true);
  });
  const endDrag = () => { drag = null; };
  mm.addEventListener('pointerup', endDrag); mm.addEventListener('pointercancel', endDrag);
  mm.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    panPixels(d * wheelUnit(e) * 2);
  }, { passive: false });
  mm.addEventListener('keydown', e => {
    const b = vp().getBounds(), c = vp().getCenter();
    let x = null;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') x = c.x + b.width * 0.8;
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') x = c.x - b.width * 0.8;
    else if (e.key === 'Home') x = 0; else if (e.key === 'End') x = 1;
    if (x === null) return;
    e.preventDefault(); centerAt(x, false);
  });
  window.addEventListener('resize', () => { if (viewer.world.getItemAt(0)) { sizeMap(); mmUpdate(); } });

  // ---- gallery ----
  const gal = $('galleryView'); let built = false;
  function thumbStyle(i) {
    const r = Math.floor(i / S.cols), c = i % S.cols;
    return 'background-size:' + (S.cols * 100) + '% ' + (S.rows * 100) + '%;background-position:' +
      (c / (S.cols - 1) * 100) + '% ' + (r / (S.rows - 1) * 100) + '%';
  }
  function buildGallery() {
    if (built) return; built = true;
    for (const w of ['panel', 'concrete']) {
      const g = ON[w]; if (!g.length) continue;
      const h = document.createElement('h2');
      h.innerHTML = WALL_NAME[w] + ' <small>· ' + g.length + ' photos, left to right</small>';
      const grid = document.createElement('div'); grid.className = 'grid';
      g.forEach((p, i) => {
        const b = document.createElement('button'); b.className = 'thumb'; b.style.cssText = thumbStyle(p.t);
        b.setAttribute('aria-label', 'Open photo ' + (i + 1) + ' of ' + g.length + ' on the ' + WALL_NAME[w].toLowerCase());
        b.onclick = () => openPhoto(p.id); grid.appendChild(b);
      });
      gal.append(h, grid);
    }
  }

  // ---- photo modal ----
  const modal = $('modal'), ph = $('photo');
  const pv = OpenSeadragon({ element: ph, prefixUrl: '', showNavigationControl: false, maxZoomPixelRatio: 3,
    visibilityRatio: 0.8, gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: false },
    gestureSettingsTouch: { pinchRotate: false } });
  // With a mouse, a plain click on the photo closes it (scroll to zoom). Drags still pan.
  pv.addHandler('canvas-click', e => {
    const pt = e.pointerType || (e.originalEvent && e.originalEvent.pointerType);
    if (e.quick && pt === 'mouse') closeModal();
  });
  // Every close-up has one number across both walls; next/prev runs off the panel wall onto the concrete wall.
  let cur = null; const seq = ALL;
  function openPhoto(id) {
    const p = byId[id]; if (!p) return; cur = id;
    modal.hidden = false;
    pv.open({ type: 'image', url: 'photos/' + id + '.jpg' });
    document.querySelector('.mWall').textContent = WALL_NAME[p.wall] + ' · ';
    document.querySelector('.mCount').textContent = (seq.indexOf(p) + 1) + ' of ' + seq.length;
    $('mOnWall').hidden = !p.box;
    setHash(id);
  }
  function step(d) { const i = seq.indexOf(byId[cur]); openPhoto(seq[(i + d + seq.length) % seq.length].id); }
  function closeModal() {
    modal.hidden = true;
    const p = byId[cur];
    // If next/prev carried you onto the other wall, close onto that wall at the photo you were viewing.
    if (p && p.box && (activeView === 'panel' || activeView === 'concrete') && p.wall !== activeView) {
      show(p.wall, () => { const [x, y, w, h] = p.box; returnTo = null; vp().fitBounds(vp().imageToViewportRectangle(x - w * 0.6, y - h * 0.6, w * 2.2, h * 2.2), true); });
    } else setHash(activeView);
  }
  $('mClose').onclick = closeModal; $('mPrev').onclick = () => step(-1); $('mNext').onclick = () => step(1);
  document.addEventListener('keydown', e => {
    if (modal.hidden) return;
    if (e.key === 'Escape') closeModal(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  $('mOnWall').onclick = () => {
    const p = byId[cur]; closeModal();
    show(p.wall, () => {
      const [x, y, w, h] = p.box;
      returnTo = null;
      vp().fitBounds(vp().imageToViewportRectangle(x - w * 0.6, y - h * 0.6, w * 2.2, h * 2.2));
      viewer.updateOverlay(hintEl, vp().imageToViewportRectangle(x, y, w, h)); hintEl.classList.add('on');
      setTimeout(() => hintEl.classList.remove('on'), 2500);
    });
  };

  // Swipe left or right to change photos. Only when the photo is not zoomed in; zoomed in, a drag pans the photo.
  const photoAtFit = () => pv.viewport.getZoom() <= pv.viewport.getHomeZoom() * 1.02;
  function lockPan() { const fit = photoAtFit(); pv.panHorizontal = !fit; pv.panVertical = !fit; }
  // Keep each photo fitted to the screen until the viewer zooms it. The viewer starts out hidden,
  // so it only learns its real size after opening; refit whenever its size changes.
  let fitMode = true;
  const refit = () => { pv.viewport.goHome(true); lockPan(); };
  pv.addHandler('open', () => { fitMode = true; refit(); requestAnimationFrame(refit); });
  pv.addHandler('resize', () => { if (fitMode) refit(); });
  ['canvas-scroll', 'canvas-pinch', 'canvas-double-click'].forEach(ev => pv.addHandler(ev, () => { fitMode = false; })); pv.addHandler('zoom', lockPan); pv.addHandler('animation-finish', lockPan);
  let sw = null;
  ph.addEventListener('pointerdown', e => {
    if (!e.isPrimary) { sw = null; return; }
    sw = photoAtFit() ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() } : null;
  }, true);
  function endSwipe(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y, fast = Date.now() - sw.t < 250; sw = null;
    if (e.type === 'pointerup' && Math.abs(dx) > 1.5 * Math.abs(dy) && (Math.abs(dx) > 60 || (fast && Math.abs(dx) > 30))) step(dx < 0 ? 1 : -1);
  }
  // Sideways scroll (tilt wheel, trackpad swipe, Shift + wheel) changes photos: one photo per gesture.
  // When the photo is zoomed in, sideways scroll pans it instead.
  sidewaysGestures(ph, (dx, g) => {
    if (!photoAtFit()) {
      pv.viewport.panBy(pv.viewport.deltaPointsFromPixels(new P(dx, 0), true), true);
      pv.viewport.applyConstraints(true); return;
    }
    if (g.done) return;
    g.acc += dx;
    if (Math.abs(g.acc) > 30) { g.done = true; step(g.acc > 0 ? 1 : -1); }
  });
  ph.addEventListener('pointerup', endSwipe, true); ph.addEventListener('pointercancel', endSwipe, true);

  // ---- views and links (#panel, #concrete, #gallery, or a photo id like #DSC02140) ----
  let activeView = null;
  function setHash(h) { try { history.replaceState(null, '', '#' + h); } catch (e) {} }
  function show(view, then) {
    activeView = view;
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
    const g = view === 'gallery';
    gal.hidden = !g; $('wallView').hidden = g;
    if (g) { buildGallery(); then && then(); } else openWall(view, then);
    if (modal.hidden) setHash(view);
  }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.view));
  function route() {
    const h = location.hash.slice(1);
    if (byId[h]) { const p = byId[h]; if (activeView === null) show(p.wall, () => openPhoto(h)); else openPhoto(h); return; }
    if (!modal.hidden) modal.hidden = true;
    show(['panel', 'concrete', 'gallery'].includes(h) ? h : 'panel');
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
